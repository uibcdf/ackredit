name: Python 3.14 installed validation
# Keep the existing workflow filename for historical run references.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feasibility:
    name: Installed validation on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/test_env_next.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=${{ matrix.python-version }}

      - name: Install package
        shell: bash -l {0}
        run: |
          python -m pip install . --no-deps

      - name: Verify installed package outside the checkout
        shell: bash -l {0}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          python "${GITHUB_WORKSPACE}/devtools/installed_smoke.py" \
            --expected-python "${{ matrix.python-version }}"
          python -m pip check

      - name: Verify interpreter and macOS architecture
        shell: bash -l {0}
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import os
          import platform
          import sys
          assert f"{sys.version_info.major}.{sys.version_info.minor}" == os.environ["EXPECTED_PYTHON"]
          if sys.platform == "darwin":
              assert platform.machine() == "arm64", platform.machine()
          print("Python", platform.python_version(), "architecture", platform.machine())
          PYTHON

      - name: Verify installed Pytest Receptor version
        shell: bash -l {0}
        run: python -c 'from importlib.metadata import version; actual = version("pytest-receptor"); print("pytest-receptor", actual); assert actual == "1.2.1", actual'

      - name: Run tests
        shell: bash -l {0}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          pytest --receptor=ci --color=yes "${GITHUB_WORKSPACE}/tests"
