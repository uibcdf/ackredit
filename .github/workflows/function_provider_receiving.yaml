name: Installed function-provider receiving matrix
run-name: Function-provider receiving ${{ inputs.conda_filename || github.sha }} ${{ inputs.conda_sha256 }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Original Conda producer SHA (leave empty for development wheels)
        type: string
        default: ''
      conda_version:
        description: Exact staged Conda version (all Conda inputs required together)
        type: string
        default: ''
      conda_filename:
        description: Exact staged noarch archive filename
        type: string
        default: ''
      conda_sha256:
        description: SHA-256 of the single staged candidate
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build immutable receiving bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: candidate-source
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/checkout@v6
        with:
          repository: uibcdf/pyunitwizard
          ref: 0e422d06b0af56e4dd2b43cafd00f059221eb405
          path: producer-source
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          ref: 598abf993a2409c025de5e912acd7eb45a257ebd
          path: released-source
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build each pure Python wheel once
        env:
          CONDA_VERSION: ${{ inputs.conda_version }}
          CONDA_FILENAME: ${{ inputs.conda_filename }}
          CONDA_SHA256: ${{ inputs.conda_sha256 }}
        run: |
          set -euo pipefail
          python candidate-source/devtools/qualification_bundle.py build \
            --candidate candidate-source --producer producer-source \
            --released released-source --output "${RUNNER_TEMP}/receiving-bundle" \
            --conda-version "${CONDA_VERSION}" --conda-filename "${CONDA_FILENAME}" \
            --conda-sha256 "${CONDA_SHA256}"
      - uses: actions/upload-artifact@v6
        with:
          name: function-provider-bundle
          path: ${{ runner.temp }}/receiving-bundle
          if-no-files-found: error
          retention-days: 30

  summarize:
    name: Verify eight complete receiving receipts
    needs: [build, receiving]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install pytest-receptor==1.2.1
      - uses: actions/download-artifact@v6
        with:
          name: function-provider-bundle
          path: ${{ runner.temp }}/receiving-bundle
      - uses: actions/download-artifact@v6
        with:
          pattern: receiving-*
          path: ${{ runner.temp }}/receiving-cells
      - name: Reject partial or skipped receiving evidence
        run: |
          set -euo pipefail
          python devtools/qualification_bundle.py summarize \
            "${RUNNER_TEMP}/receiving-cells" \
            --bundle "${RUNNER_TEMP}/receiving-bundle" \
            --output "${RUNNER_TEMP}/receiving-matrix.json"
      - uses: actions/upload-artifact@v6
        with:
          name: function-provider-matrix
          path: ${{ runner.temp }}/receiving-matrix.json
          if-no-files-found: error
          retention-days: 30

  receiving:
    name: Receiving on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: function-provider-bundle
          path: ${{ runner.temp }}/receiving-bundle
      - name: Setup receiving environment
        if: inputs.conda_version == ''
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: receiving
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=${{ matrix.python-version }} numpy pint unyt
      - name: Setup Conda receiving environment
        if: inputs.conda_version != ''
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: receiving
          environment-file: devtools/conda-envs/test_env.yaml
          python-version: ${{ matrix.python-version }}
          channels: uibcdf,conda-forge
          channel-priority: strict
          auto-activate-base: false
          miniforge-version: latest
      - name: Checkout shared exact-file verifier
        if: inputs.conda_version != ''
        uses: actions/checkout@v6
        with:
          repository: uibcdf/molsyssuite
          ref: c3e2b9b3dabf3d1c65349c389a23048957bea21a
          path: .molsyssuite
      - name: Checkout original Conda producer inputs
        if: inputs.conda_version != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          path: conda-source
      - name: Install the exact staged Conda candidate
        if: inputs.conda_version != ''
        shell: bash -l {0}
        env:
          CANDIDATE_FILENAME: ${{ inputs.conda_filename }}
          CANDIDATE_SHA256: ${{ inputs.conda_sha256 }}
        run: |
          set -euo pipefail
          conda install --yes --override-channels --strict-channel-priority \
            -c uibcdf -c conda-forge "python=${{ matrix.python-version }}" numpy pint unyt jinja2 packaging
          python .molsyssuite/devtools/scripts/installed_noarch.py download \
            --root conda-source --sha256 "${CANDIDATE_SHA256}" --directory "${RUNNER_TEMP}/noarch-artifact"
          python .molsyssuite/devtools/scripts/installed_noarch.py install \
            --root conda-source --sha256 "${CANDIDATE_SHA256}" --filename "${CANDIDATE_FILENAME}" \
            --python "${{ matrix.python-version }}" --directory "${RUNNER_TEMP}/noarch-artifact"
      - name: Verify bundle and install the same candidate files
        shell: bash -l {0}
        env:
          CONDA_VERSION: ${{ inputs.conda_version }}
        run: |
          set -euo pipefail
          python devtools/qualification_bundle.py verify "${RUNNER_TEMP}/receiving-bundle"
          if [[ -z "${CONDA_VERSION}" ]]; then
            python -m pip install --no-deps --no-index "${RUNNER_TEMP}"/receiving-bundle/candidate/*.whl
          fi
          python -m pip install --no-deps --no-index "${RUNNER_TEMP}"/receiving-bundle/producer/*.whl
          python -m pip check
      - name: Verify Conda provenance before real science
        if: inputs.conda_version != ''
        shell: bash -l {0}
        env:
          CANDIDATE_FILENAME: ${{ inputs.conda_filename }}
          CANDIDATE_SHA256: ${{ inputs.conda_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/receiving-evidence"
          cd "${RUNNER_TEMP}"
          python -P "${GITHUB_WORKSPACE}/.molsyssuite/devtools/scripts/installed_noarch.py" verify \
            --root "${GITHUB_WORKSPACE}/conda-source" --filename "${CANDIDATE_FILENAME}" \
            --sha256 "${CANDIDATE_SHA256}" --directory "${RUNNER_TEMP}/noarch-artifact" \
            --platform "${{ matrix.os == 'macos-15' && 'osx-arm64' || 'linux-64' }}" \
            --python "${{ matrix.python-version }}" --output "${RUNNER_TEMP}/receiving-evidence/conda-before.json"
      - name: Verify installed Pytest Receptor version
        shell: bash -l {0}
        run: python -c 'from importlib.metadata import version; actual = version("pytest-receptor"); print("pytest-receptor", actual); assert actual == "1.2.1", actual'
      - name: Qualify real pipeline outside both source repositories
        shell: bash -l {0}
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
          ACKREDIT_QUALIFICATION_BUNDLE: ${{ runner.temp }}/receiving-bundle
          ACKREDIT_QUALIFICATION_OUTPUT: ${{ runner.temp }}/receiving-evidence
        run: |
          set -euo pipefail
          mkdir -p "${ACKREDIT_QUALIFICATION_OUTPUT}"
          cd "${RUNNER_TEMP}"
          python -m pytest --receptor=ci \
            --junitxml="${ACKREDIT_QUALIFICATION_OUTPUT}/tests.xml" \
            --receptor-events="${ACKREDIT_QUALIFICATION_OUTPUT}/events.jsonl" \
            "${GITHUB_WORKSPACE}/devtools/qualification/test_pyunitwizard.py"
      - name: Verify Conda provenance after real science
        if: inputs.conda_version != ''
        shell: bash -l {0}
        env:
          CANDIDATE_FILENAME: ${{ inputs.conda_filename }}
          CANDIDATE_SHA256: ${{ inputs.conda_sha256 }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          python -P "${GITHUB_WORKSPACE}/.molsyssuite/devtools/scripts/installed_noarch.py" verify \
            --root "${GITHUB_WORKSPACE}/conda-source" --filename "${CANDIDATE_FILENAME}" \
            --sha256 "${CANDIDATE_SHA256}" --directory "${RUNNER_TEMP}/noarch-artifact" \
            --platform "${{ matrix.os == 'macos-15' && 'osx-arm64' || 'linux-64' }}" \
            --python "${{ matrix.python-version }}" --output "${RUNNER_TEMP}/receiving-evidence/conda-after.json"
      - name: Retain receiving evidence including failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: receiving-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/receiving-evidence
          if-no-files-found: error
          retention-days: 30
