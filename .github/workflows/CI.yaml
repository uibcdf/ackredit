name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.16.5
      - run: ruff check .
      - run: ruff format --check .

  test:
    # The contract is `>=3.11,<3.14` and this ran 3.13 alone, so two of the three
    # versions Ackredit promises had never been run by anything
    # (`uibcdf/ackredit#63`). 3.14 is here as evidence for the suite transition in
    # `uibcdf/molsyssuite#29` and claims nothing: it does not gate a merge, and
    # `requires-python` stays at the default contract until `suite.toml` names
    # Ackredit. `tests/test_workflow_hygiene.py` holds this list to the contract.
    #
    # macOS gates on the development version, so a platform regression shows on
    # the push that causes it: the session journal relies on O_APPEND, and
    # multiprocessing starts with spawn there. Every other macOS cell runs in
    # the weekly matrix (`uibcdf/ackredit#71`).
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - os: macos-latest
            python-version: "3.13"
            experimental: false
          - os: ubuntu-latest
            python-version: "3.14"
            experimental: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # smonitor and depdigest are core dependencies published to the uibcdf
      # conda channel and not to PyPI, so the environment comes from conda.
      # The contract file pins `python >=3.11,<3.14`, so the evidence lane needs
      # its own: asking for `python=3.14` against that pin is unsolvable, and
      # that is how the first 3.14 lane failed before running a single test
      # (`uibcdf/ackredit#64`). The two files are held identical apart from the
      # interpreter, so what the lane measures stays comparable.
      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/${{ matrix.experimental && 'test_env_next.yaml' || 'test_env.yaml' }}
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=${{ matrix.python-version }}

      - name: Info conda
        shell: bash -l {0}
        run: |
          set -euo pipefail
          micromamba activate test
          micromamba info
          micromamba list

      # `requires-python` is still `>=3.11,<3.14`, and it stays there until
      # `suite.toml` names Ackredit. pip honours it, so the evidence lane has to
      # say so out loud — the same `--ignore-requires-python` the local run
      # reported in `uibcdf/molsyssuite#29` used. The promised versions never
      # pass it: there, refusing to install is the contract working.
      - name: Install package
        shell: bash -l {0}
        run: |
          python -m pip install . --no-deps ${{ matrix.experimental && '--ignore-requires-python' || '' }}

      - name: Test import module
        shell: bash -l {0}
        run: |
          # Without -e a failing line does not stop the script, and GitHub reads
          # the exit status of the last one. This check printed a traceback and
          # reported success.
          set -euo pipefail
          echo "::group::Importing module from home directory"
          cd
          pwd
          echo 'import ackredit; print("Version of the package: {}".format(ackredit.__version__))' | python
          echo "::endgroup::"

      # --receptor=ci is the combined workflow both receptor tools document:
      # compact output at the source, inspected afterwards with gh-run-receptor.
      - name: Run tests
        shell: bash -l {0}
        run: |
          pytest --receptor=ci --color=yes

  docs:
    name: Documentation build on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/docs_env.yaml
          environment-name: docs
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=3.13

      - name: Install package
        shell: bash -l {0}
        run: |
          python -m pip install . --no-deps

      # -W turns warnings into errors: a broken cross-reference, an unrenderable
      # docstring or a toctree that matches nothing fails the build.
      - name: Build the documentation
        shell: bash -l {0}
        run: |
          python -m sphinx -b html -W docs docs/_build/html
