name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.16.5
      - run: ruff check .
      - run: ruff format --check .

  test:
    # Full supported-minor coverage remains gating (uibcdf/ackredit#63).
    # macOS covers the routine minor here and every minor weekly (#71).
    # Python 3.14 is required by MolSysSuite and qualified under #80.
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-15
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Core dependencies come from the uibcdf Conda channel.
      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=${{ matrix.python-version }}

      - name: Info conda
        shell: bash -l {0}
        run: |
          set -euo pipefail
          micromamba activate test
          micromamba info
          micromamba list

      - name: Install package
        shell: bash -l {0}
        run: |
          python -m pip install . --no-deps

      - name: Verify installed package outside the checkout
        shell: bash -l {0}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          python "${GITHUB_WORKSPACE}/devtools/installed_smoke.py" \
            --expected-python "${{ matrix.python-version }}"
          python -m pip check

      - name: Verify installed Pytest Receptor version
        shell: bash -l {0}
        run: python -c 'from importlib.metadata import version; actual = version("pytest-receptor"); print("pytest-receptor", actual); assert actual == "1.2.1", actual'

      # --receptor=ci is the combined workflow both receptor tools document:
      # compact output at the source, inspected afterwards with gh-run-receptor.
      - name: Run tests
        shell: bash -l {0}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          pytest --receptor=ci --color=yes "${GITHUB_WORKSPACE}/tests"

  docs:
    name: Documentation build on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/docs_env.yaml
          environment-name: docs
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=3.14

      - name: Install package
        shell: bash -l {0}
        run: |
          python -m pip install . --no-deps

      # -W turns warnings into errors: a broken cross-reference, an unrenderable
      # docstring or a toctree that matches nothing fails the build.
      - name: Build the documentation
        shell: bash -l {0}
        run: |
          python -m sphinx -b html -W docs docs/_build/html
