name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.16.5
      - run: ruff check .
      - run: ruff format --check .

  test:
    # Full supported-minor coverage remains gating (uibcdf/ackredit#63).
    # macOS covers the routine minor here and every minor weekly (#71).
    # Unsupported 3.14 belongs in the separate manual feasibility workflow (#74).
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-15
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Core dependencies come from the uibcdf Conda channel.
      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=${{ matrix.python-version }}

      - name: Info conda
        shell: bash -l {0}
        run: |
          set -euo pipefail
          micromamba activate test
          micromamba info
          micromamba list

      - name: Install package
        shell: bash -l {0}
        run: |
          python -m pip install . --no-deps

      - name: Test import module
        shell: bash -l {0}
        run: |
          # Without -e a failing line does not stop the script, and GitHub reads
          # the exit status of the last one. This check printed a traceback and
          # reported success.
          set -euo pipefail
          echo "::group::Importing module from home directory"
          cd
          pwd
          echo 'import ackredit; print("Version of the package: {}".format(ackredit.__version__))' | python
          echo "::endgroup::"

      # --receptor=ci is the combined workflow both receptor tools document:
      # compact output at the source, inspected afterwards with gh-run-receptor.
      - name: Run tests
        shell: bash -l {0}
        run: |
          pytest --receptor=ci --color=yes

  docs:
    name: Documentation build on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/docs_env.yaml
          environment-name: docs
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=3.13

      - name: Install package
        shell: bash -l {0}
        run: |
          python -m pip install . --no-deps

      # -W turns warnings into errors: a broken cross-reference, an unrenderable
      # docstring or a toctree that matches nothing fails the build.
      - name: Build the documentation
        shell: bash -l {0}
        run: |
          python -m sphinx -b html -W docs docs/_build/html
