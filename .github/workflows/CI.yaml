name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.16.5
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test on ubuntu-latest, Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # smonitor and depdigest are core dependencies published to the uibcdf
      # conda channel and not to PyPI, so the environment comes from conda.
      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=3.13

      - name: Info conda
        shell: bash -l {0}
        run: |
          micromamba activate test
          micromamba info
          micromamba list

      - name: Install package
        shell: bash -l {0}
        run: |
          python -m pip install . --no-deps

      - name: Test import module
        shell: bash -l {0}
        run: |
          echo "::group::Importing module from home directory"
          cd
          pwd
          echo 'import ackredit; print("Version of the package: {}".format(ackredit.__version__))' | python
          echo "::endgroup::"

      - name: Run tests
        shell: bash -l {0}
        run: |
          pytest -v --color=yes

  docs:
    name: Documentation build on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/docs_env.yaml
          environment-name: docs
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=3.13

      - name: Install package
        shell: bash -l {0}
        run: |
          python -m pip install . --no-deps

      # -W turns warnings into errors: a broken cross-reference, an unrenderable
      # docstring or a toctree that matches nothing fails the build.
      - name: Build the documentation
        shell: bash -l {0}
        run: |
          python -m sphinx -b html -W docs docs/_build/html
