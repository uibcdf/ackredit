name: CI full matrix

on:
  schedule:
    # Weekly, so the supported Python range is exercised without slowing down
    # every push. The fast lane in CI.yaml covers the development version.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Linux only, for now. smonitor and depdigest are published to the
        # uibcdf channel as linux-64 builds with per-interpreter ABI pins, so a
        # macOS environment cannot be solved at all. Both recipes already
        # declare `noarch: python` at HEAD, so their next release resolves this
        # and macos-latest can be restored; tracked upstream through
        # uibcdf/molsyssuite#29. A lane that cannot pass teaches everyone to
        # ignore the CI, which is the defect reported in
        # uibcdf/molsyssuite#33.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=${{ matrix.python-version }}

      - name: Install package
        shell: bash -l {0}
        run: |
          python -m pip install . --no-deps

      - name: Test import module
        shell: bash -l {0}
        run: |
          set -euo pipefail
          cd
          echo 'import ackredit; print("Version of the package: {}".format(ackredit.__version__))' | python

      - name: Run tests
        shell: bash -l {0}
        run: |
          pytest --receptor=ci --color=yes
