name: CI full matrix

on:
  schedule:
    # Weekly: every operating system against every Python version. CI.yaml
    # runs the promised versions on Linux, and macOS on the development
    # version, on every push; this is the rest of the product.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # macOS was removed while smonitor and depdigest were published as
        # linux-64 builds with per-interpreter ABI pins, which a macOS
        # environment could not solve. The floors Ackredit requires are noarch
        # now, so it is back (`uibcdf/ackredit#71`).
        #
        # 3.14 is evidence for `uibcdf/molsyssuite#29` and claims nothing, as in
        # CI.yaml: it does not gate, and it uses the evidence environment.
        # `tests/test_workflow_hygiene.py` reads this file as well as CI.yaml.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            experimental: true
          - os: macos-latest
            python-version: "3.14"
            experimental: true

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/${{ matrix.experimental && 'test_env_next.yaml' || 'test_env.yaml' }}
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=${{ matrix.python-version }}

      - name: Install package
        shell: bash -l {0}
        run: |
          python -m pip install . --no-deps ${{ matrix.experimental && '--ignore-requires-python' || '' }}

      - name: Test import module
        shell: bash -l {0}
        run: |
          set -euo pipefail
          cd
          echo 'import ackredit; print("Version of the package: {}".format(ackredit.__version__))' | python

      - name: Run tests
        shell: bash -l {0}
        run: |
          pytest --receptor=ci --color=yes
