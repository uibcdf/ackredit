name: CI full matrix

on:
  schedule:
    - cron: "23 5 * * MON"
    - cron: "31 1 * * *"
      timezone: "America/Mexico_City"
  workflow_dispatch:
    inputs:
      probe_backlog:
        description: Check skipped-commit debt without running the matrix
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  nightly-decision:
    name: Check skipped-commit backlog
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '31 1 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.probe_backlog == true)
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.decide.outputs.run_full }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Decide whether to run the full matrix
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python devtools/ci_backlog.py

  test:
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    needs: nightly-decision
    if: >-
      always() && inputs.probe_backlog != true
      && (github.event_name != 'schedule' || github.event.schedule != '31 1 * * *'
      || needs.nightly-decision.result != 'success'
      || needs.nightly-decision.outputs.run_full == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    concurrency:
      group: ci-full-${{ github.ref }}-${{ matrix.os }}-${{ matrix.python-version }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=${{ matrix.python-version }}

      - name: Install package
        shell: bash -l {0}
        run: |
          python -m pip install . --no-deps

      - name: Test import module
        shell: bash -l {0}
        run: |
          set -euo pipefail
          cd
          echo 'import ackredit; print("Version of the package: {}".format(ackredit.__version__))' | python

      - name: Verify interpreter and macOS architecture
        shell: bash -l {0}
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import os
          import platform
          import sys
          assert f"{sys.version_info.major}.{sys.version_info.minor}" == os.environ["EXPECTED_PYTHON"]
          if sys.platform == "darwin":
              assert platform.machine() == "arm64", platform.machine()
          print("Python", platform.python_version(), "architecture", platform.machine())
          PYTHON

      - name: Run tests
        shell: bash -l {0}
        run: |
          pytest --receptor=ci --color=yes
