name: Stage one reviewed noarch Conda candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full source SHA with passing release gates
        required: true
        type: string
      version:
        description: Version in the committed release plan
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  stage:
    uses: uibcdf/molsyssuite/.github/workflows/publish-noarch-conda.yaml@95f693be10c9205ab9b912cb53453710a207bf45
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      version: ${{ inputs.version }}
    secrets:
      ANACONDA_TOKEN: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}
