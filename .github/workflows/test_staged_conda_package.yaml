name: Test installed staged Conda package
run-name: Installed ${{ inputs.filename }} ${{ inputs.sha256 }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full original producer SHA; workflow ref may contain a reviewed administrative correction
        required: true
        type: string
      filename:
        description: Exact staged noarch archive filename
        required: true
        type: string
      sha256:
        description: SHA-256 from the inspected producer artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  installed:
    uses: uibcdf/molsyssuite/.github/workflows/test-installed-noarch-conda.yaml@c3e2b9b3dabf3d1c65349c389a23048957bea21a
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      filename: ${{ inputs.filename }}
      sha256: ${{ inputs.sha256 }}
