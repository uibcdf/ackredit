name: Test installed staged Conda package
run-name: Installed ${{ inputs.filename }} ${{ inputs.sha256 }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full source SHA; dispatch at a ref resolving to this SHA
        required: true
        type: string
      filename:
        description: Exact staged noarch archive filename
        required: true
        type: string
      sha256:
        description: SHA-256 from the inspected producer artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  installed:
    uses: uibcdf/molsyssuite/.github/workflows/test-installed-noarch-conda.yaml@2a2a459cc3795bb92766fffa0fe28f4d80f01ad4
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      filename: ${{ inputs.filename }}
      sha256: ${{ inputs.sha256 }}
