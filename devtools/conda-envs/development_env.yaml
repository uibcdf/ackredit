channels:
- uibcdf
- conda-forge
dependencies:
- python=3.14
- pip
- python-build >=1.2
- setuptools >=77.0.3
- versioningit >=3.0
# Testing
- pytest
- pytest-cov
- pytest-xdist
- pytest-receptor ==1.2.1
# Documentation
- sphinx
- pydata-sphinx-theme
- sphinx-copybutton
- sphinx-design
- myst-nb
- jupyterlab
# Suite infrastructure
- smonitor >=0.16.0
- depdigest >=0.11.0
- argdigest >=0.15.0
- pyyaml >=6
# Optional features Ackredit can use when present
- duecredit >=0.10.2
- pip:
  - ruff==0.16.5
