channels:
- uibcdf
- conda-forge
dependencies:
- python >=3.11,<3.14
- pip
- pytest
- pytest-cov
- pytest-xdist
# Compact, truth-preserving test output for a CI log and for an agent reading it.
- pytest-receptor
- codecov
# Suite infrastructure. These are core dependencies of Ackredit and are
# published to the uibcdf conda channel, not to PyPI.
- smonitor
- depdigest
- pyyaml
# The dashboard renderer escapes through Jinja rather than through whatever
# autoescaping default the installed Flask happens to have. Jinja arrives with
# Flask in a user's environment; here it is declared so the escaping guard runs
# instead of being skipped.
- jinja2
