# Focused Python 3.14 installed-validation environment (uibcdf/ackredit#80).
# The ordinary contract environment also admits 3.14. Keep identical dependencies
# so manual evidence is comparable with the required full CI lanes.
channels:
- uibcdf
- conda-forge
dependencies:
- python >=3.14,<3.15
- pip
- pytest
- pytest-cov
- pytest-xdist
# Compact, truth-preserving test output for a CI log and for an agent reading it.
- pytest-receptor
- codecov
# Suite infrastructure. These are core dependencies of Ackredit and are
# published to the uibcdf conda channel, not to PyPI.
- smonitor
- depdigest
- argdigest
- pyyaml
