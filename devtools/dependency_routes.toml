# Requirements belong to pyproject.toml; this inventory classifies their routes.
# Shared tool proposal: uibcdf/molsyssuite#45; consumer adoption: uibcdf/ackredit#108.
schema = "molsyssuite.dependency-routes@1"
reason = "Member-owned review of every maintained Ackredit runtime/build/CI route"
source_routes = []
source_reason = "No required Ackredit sibling is source-supplied. PyUnitWizard is a pinned receiving fixture, and candidate/released Ackredit wheels are qualified artifacts; smonitor/depdigest/argdigest remain Conda-supplied."

[shared_tool]
repository = "uibcdf/molsyssuite"
commit = "43b9f94bf5ab0ec3f54a4b2ca5b23b791d6af0bc"

[[recipes]]
path = "devtools/conda-build/meta.yaml"
kind = "shared-noarch"
plan = "devtools/conda-build/release_plan.toml"
resources = "devtools/conda-build/resources.toml"
reason = "One architecture-independent public Conda artifact; existing recipe/resource/identity checks are reused."

[[environments]]
path = "devtools/conda-envs/development_env.yaml"
kind = "runtime"
reason = "Routine source development, tests and docs with all required runtime floors; use strict priority when creating this environment."
channel_priority = "strict"
python_minor = "3.14"

[[environments]]
path = "devtools/conda-envs/test_env.yaml"
kind = "runtime"
reason = "Ordinary/full/coverage/receiving installed tests; workflow Conda configuration selects strict priority."
channel_priority = "strict"

[[environments]]
path = "devtools/conda-envs/test_env_next.yaml"
kind = "runtime"
reason = "Normal installed Python 3.14 validation; historical filename is retained and workflow selects strict priority."
channel_priority = "strict"
python_minor = "3.14"

[[environments]]
path = "devtools/conda-envs/docs_env.yaml"
kind = "runtime"
reason = "Sphinx imports installed Ackredit; CI supplies the complete runtime and selects strict priority."
channel_priority = "strict"

[[environments]]
path = "devtools/conda-envs/build_env.yaml"
kind = "build-only"
reason = "Conda build/upload bootstrap only. The recipe host creates the separate build environment; this file does not install Ackredit."

