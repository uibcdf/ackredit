schema = "molsyssuite.conda-plan@1"
version = "0.12.0"
package = "ackredit"
build_number = 0
route = "staged"
profile = "noarch-python"
reason = "Deliver completed post-0.11.0 repairs, lazy imports and author validation for pre-1.0 stabilization, including accepted bounded evidence/validator promises. Require complete exact-source and installed matrices, real PyUnitWizard receiving and candidate-installed publication checks against one original noarch archive before promotion."
decision_by = "The maintainer explicitly authorized closing 0.12.0 for stabilization on 2026-10-07 under Ackredit #127, following #126. Evidence and standalone-validator promises accepted under #114/#125 begin only at verified public 0.12.0. General public 1.x commitment remains deferred; existing public portable/provider contracts are unchanged. Shared coordination is MolSysSuite #97 and MOLI #46."
artifact_subdirs = ["noarch"]
test_platforms = ["linux-64", "osx-arm64"]
python_versions = ["3.11", "3.12", "3.13", "3.14"]
required_workflows = [".github/workflows/CI.yaml", ".github/workflows/CI_full_matrix.yaml", ".github/workflows/molsyssuite-policy.yml", ".github/workflows/conda-publication-policy.yml"]
requires_installed_gate = true
new_compatibility_surface = true
coupled_release = false
dependencies_public = true

[gate_jobs.".github/workflows/CI.yaml"]
"Ruff on ubuntu-latest" = ["Run ruff check .", "Run ruff format --check ."]
"Documentation build on ubuntu-latest" = ["Build the documentation"]
"Test on ubuntu-latest, Python 3.11" = ["Verify installed package outside the checkout", "Run tests"]
"Test on ubuntu-latest, Python 3.12" = ["Verify installed package outside the checkout", "Run tests"]
"Test on ubuntu-latest, Python 3.13" = ["Verify installed package outside the checkout", "Run tests"]
"Test on ubuntu-latest, Python 3.14" = ["Verify installed package outside the checkout", "Run tests"]
"Test on macos-15, Python 3.14" = ["Verify installed package outside the checkout", "Run tests"]

[gate_jobs.".github/workflows/CI_full_matrix.yaml"]
"Test on ubuntu-latest, Python 3.11" = ["Verify installed package outside the checkout", "Verify interpreter and macOS architecture", "Run tests"]
"Test on ubuntu-latest, Python 3.12" = ["Verify installed package outside the checkout", "Verify interpreter and macOS architecture", "Run tests"]
"Test on ubuntu-latest, Python 3.13" = ["Verify installed package outside the checkout", "Verify interpreter and macOS architecture", "Run tests"]
"Test on ubuntu-latest, Python 3.14" = ["Verify installed package outside the checkout", "Verify interpreter and macOS architecture", "Run tests"]
"Test on macos-15, Python 3.11" = ["Verify installed package outside the checkout", "Verify interpreter and macOS architecture", "Run tests"]
"Test on macos-15, Python 3.12" = ["Verify installed package outside the checkout", "Verify interpreter and macOS architecture", "Run tests"]
"Test on macos-15, Python 3.13" = ["Verify installed package outside the checkout", "Verify interpreter and macOS architecture", "Run tests"]
"Test on macos-15, Python 3.14" = ["Verify installed package outside the checkout", "Verify interpreter and macOS architecture", "Run tests"]

[gate_jobs.".github/workflows/molsyssuite-policy.yml"]
"policy / conformance" = ["Check repository conformance", "Check Python lint and imports", "Check Python formatting"]

[gate_jobs.".github/workflows/conda-publication-policy.yml"]
"publication / check" = ["Check publication workflow controls", "Check declared noarch recipe and resources without building"]
