[build-system]
requires = ["setuptools>=61.0", "versioningit>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ackredit"
dynamic = ["version"]
description = "Ackredit — trace what you used, cite what matters."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
# These must agree with CITATION.cff, which is the authority a citing tool reads.
# tests/test_self_citation.py asserts they do.
authors = [
  { name = "Diego Prada-Gracia" },
  { name = "Liliana M. Moreno-Vargas" },
]
maintainers = [
  { name = "UIBCDF Development Team" },
]
dependencies = [
  "smonitor>=0.13.0",
  "depdigest>=0.10.0",
  # CITATION.cff is YAML. Reading it with anything less produces confident
  # wrong answers on constructs the specification documents.
  "pyyaml>=6",
]

[project.optional-dependencies]
# One extra per optional feature, and `full` as the union of them. Every entry
# here must be a library declared in ackredit/_depdigest.py, and every library
# declared there must appear here, or `dependency_info()` reports a feature the
# user was given no way to install. Guarded by tests/test_packaging.py.
duecredit = ["duecredit"]
full = ["duecredit"]
test = [
  "pytest>=8",
  "ruff==0.16.5",
]
docs = [
  "sphinx",
  "pydata-sphinx-theme",
  "sphinx-copybutton",
  "sphinx-design",
  "myst-nb",
]

[project.urls]
Homepage = "https://github.com/uibcdf/ackredit"
Repository = "https://github.com/uibcdf/ackredit"

[project.scripts]
ackredit = "ackredit.cli:main"

# CITATION.cff travels inside the package. find_and_parse_cff looks in the
# package directory and its parent, and in an installed wheel the parent is
# site-packages, so a copy at the repository root is invisible to anyone who
# did not clone. tests/test_self_citation.py checks the built wheel, not the
# checkout, because an editable install hides exactly this.
[tool.setuptools.package-data]
ackredit = ["CITATION.cff"]

[tool.setuptools.packages.find]
include = ["ackredit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
# Root integration guides are synchronized, read-only copies. Their canonical
# repositories own formatting; MolSysSuite checks byte drift (uibcdf/molsyssuite#12).
extend-exclude = [
    "DEPDIGEST_GUIDE.md",
    "GH_RUN_RECEPTOR_GUIDE.md",
    "MOLSYSSUITE_GUIDE.md",
    "SMONITOR_GUIDE.md",
    # Archived reports quote the defective code and the real output they
    # describe. Reformatting that evidence would misrepresent what happened:
    # Python prints single quotes, and a record saying otherwise is no longer a
    # record. The same reason excludes this directory from the documented-API
    # check in tests/test_documented_api.py.
    "devguide/archive",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# ensure_configured() must run before the package's own imports, so they are
# deliberately not at the top of the file.
"ackredit/__init__.py" = ["E402"]

# The version has one source of truth: the Git tag. A static literal in this file
# and a tag are two sources kept in step by hand, and they drift the first time
# someone forgets.
[tool.versioningit]
default-version = "0.0.0+unknown"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.vcs]
method = "git"
match = ["*"]
default-tag = "0.0.0"

# The canonical MolSysSuite release identifier, from suite.toml's
# `policies.release-version.versioningit-pattern`. `require-match` is what makes
# it a gate: a tag like `v1.2.3`, `1.2.3rc1` or `01.2.3` fails the build instead
# of quietly producing some other version.
[tool.versioningit.tag2version]
regex = '^(?P<version>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$'
require-match = true

[tool.versioningit.write]
file = "ackredit/_version.py"
