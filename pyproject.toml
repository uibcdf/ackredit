[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ackredit"
version = "0.5.0"
description = "Ackredit — trace what you used, cite what matters."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
  { name = "UIBCDF Development Team" }
]
dependencies = [
  "smonitor>=0.13.0",
  "depdigest>=0.10.0",
  # CITATION.cff is YAML. Reading it with anything less produces confident
  # wrong answers on constructs the specification documents.
  "pyyaml>=6",
]

[project.optional-dependencies]
web = ["flask"]
full = ["flask"]
test = [
  "pytest>=8",
  "ruff==0.16.5",
]
docs = [
  "sphinx",
  "pydata-sphinx-theme",
  "sphinx-copybutton",
  "sphinx-design",
  "myst-nb",
]

[project.urls]
Homepage = "https://github.com/uibcdf/ackredit"
Repository = "https://github.com/uibcdf/ackredit"

[project.scripts]
ackredit = "ackredit.cli:main"

[tool.setuptools.packages.find]
include = ["ackredit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
# Root integration guides are synchronized, read-only copies. Their canonical
# repositories own formatting; MolSysSuite checks byte drift (uibcdf/molsyssuite#12).
extend-exclude = [
    "DEPDIGEST_GUIDE.md",
    "GH_RUN_RECEPTOR_GUIDE.md",
    "MOLSYSSUITE_GUIDE.md",
    "SMONITOR_GUIDE.md",
    # Archived reports quote the defective code and the real output they
    # describe. Reformatting that evidence would misrepresent what happened:
    # Python prints single quotes, and a record saying otherwise is no longer a
    # record. The same reason excludes this directory from the documented-API
    # check in tests/test_documented_api.py.
    "devguide/archive",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# ensure_configured() must run before the package's own imports, so they are
# deliberately not at the top of the file.
"ackredit/__init__.py" = ["E402"]
